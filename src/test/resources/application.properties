# Disable automated Dev Services Docker client scanning for tests
quarkus.datasource.devservices.enabled=false

# Directly bind the test suite to your manual Docker container port
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus_test
quarkus.datasource.password=quarkus_test
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test

# Match your ORM settings for test parity
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql